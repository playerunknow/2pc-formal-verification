name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Інструменти кешуються за версіями, зафіксованими в scripts/common.py
      - name: Cache tools
        uses: actions/cache@v4
        with:
          path: |
            tools/tla2tools.jar
            tools/apalache
            tools/plantuml.jar
            tools/tlapm
          key: tools-${{ hashFiles('scripts/common.py') }}

      - name: Setup tools
        run: python scripts/setup_tools.py --tlaps

      - name: Run verification (TLC + Apalache + TLAPS, без Full_4)
        run: python scripts/run_all.py --quick

      - name: Render diagrams
        run: python scripts/render_diagrams.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: |
            results/
            diagrams/generated/
